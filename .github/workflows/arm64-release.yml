name: ARM64 Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed arm64 Release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      AHAROU_CI_BUILD: "1"
      EXPECTED_SIGNER_SHA256: 9d0ddb97108acaf7d00fb5e7a2e02bcee2a890d764b30e37ecbfcc6ee5540671
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Check source
        run: |
          python3 scripts/check_architecture.py
          python3 scripts/check_migrations.py
          python3 scripts/check_skills.py
          chmod +x ./gradlew
          git config core.fileMode false

      - name: Stage published preinstalled Alpine assets
        run: python3 scripts/stage_preinstalled_assets.py --apply

      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing signing keystore}"
          : "${KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${KEY_ALIAS:?Missing key alias}"
          : "${KEY_PASSWORD:?Missing key password}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aharou-signing.p12"
          test -s "$RUNNER_TEMP/aharou-signing.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/aharou-signing.p12" -srcstoretype PKCS12 \
            -srcstorepass:env KEYSTORE_PASSWORD -srcalias "$KEY_ALIAS" \
            -destkeystore app/aicode.jks -deststoretype JKS \
            -deststorepass:env KEYSTORE_PASSWORD -destkeypass:env KEY_PASSWORD -destalias "$KEY_ALIAS"
          keytool -exportcert -keystore app/aicode.jks -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/aharou-signing.der"
          printf '%s  %s\n' "$EXPECTED_SIGNER_SHA256" "$RUNNER_TEMP/aharou-signing.der" | sha256sum --check
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('app/keystore.properties').write_text(
              'storeFile=aicode.jks\n'
              + 'storePassword=' + os.environ['KEYSTORE_PASSWORD'] + '\n'
              + 'keyAlias=' + os.environ['KEY_ALIAS'] + '\n'
              + 'keyPassword=' + os.environ['KEY_PASSWORD'] + '\n'
          )
          PY

      - name: Build arm64 Release APK
        run: ./gradlew :app:assembleArmsoloRelease --no-configuration-cache --stacktrace

      - name: Verify and collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/armsolo/release/app-armsolo-release.apk dist/arm64-release.apk
          cp app/build/outputs/apk/armsolo/release/output-metadata.json dist/output-metadata.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/arm64-release.apk | tee dist/certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/arm64-release.apk > "$RUNNER_TEMP/aharou-badging.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path
          apk = Path('dist/arm64-release.apk')
          with zipfile.ZipFile(apk) as archive:
              abis = {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, f'Unexpected ABIs: {abis}'
          badging = Path(os.environ['RUNNER_TEMP'], 'aharou-badging.txt').read_text()
          assert "package: name='com.aharou.agent'" in badging, 'Unexpected application ID'
          assert 'application-debuggable' not in badging, 'APK must not be debuggable'
          certificate = Path('dist/certificate.txt').read_text()
          signers = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$', certificate, re.M)
          assert [value.lower() for value in signers] == [os.environ['EXPECTED_SIGNER_SHA256']], 'Signing certificate mismatch'
          metadata = json.loads(Path('dist/output-metadata.json').read_text())
          element = metadata['elements'][0]
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('dist/SHA256SUMS').write_text(f'{digest}  arm64-release.apk\n')
          summary = (f"arm64-release.apk: {apk.stat().st_size} bytes\n"
                     f"SHA-256: {digest}\n"
                     f"Version: {element['versionName']} ({element['versionCode']})\n"
                     f"Commit: {os.environ['GITHUB_SHA']}\n"
                     f"Signer SHA-256: {signers[0]}\n")
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Signed ARM64 Release APK\n```text\n' + summary + '```\n')
          PY
          if test -f app/build/outputs/mapping/armsoloRelease/mapping.txt; then
            gzip -c app/build/outputs/mapping/armsoloRelease/mapping.txt > dist/mapping.txt.gz
          fi

      - name: Upload arm64 Release
        uses: actions/upload-artifact@v7
        with:
          name: Aharou-arm64-release-${{ github.sha }}
          path: dist/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Clean signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for path in [Path('app/aicode.jks'), Path('app/keystore.properties'),
                       Path(os.environ['RUNNER_TEMP'], 'aharou-signing.p12'),
                       Path(os.environ['RUNNER_TEMP'], 'aharou-signing.der')]:
              path.unlink(missing_ok=True)
          PY
